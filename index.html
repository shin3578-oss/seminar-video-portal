<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="origin"><!-- YouTube埋め込みはドメイン照合に参照元が要る（no-referrerだとエラー153） -->
<meta name="theme-color" content="#7c3aed">
<title>セミナー動画倉庫｜医療法人社団KDS 大崎オーバルコート歯科・矯正歯科室</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#15202b; --sub:#5b6b7c; --line:#e2e8ee;
  --acc:#6d28d9; --acc-soft:#efe8fd; --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 16px rgba(16,32,48,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1419; --card:#182029; --fg:#e6edf3; --sub:#94a6b8; --line:#28323d;
  --acc:#a78bfa; --acc-soft:#2a2140; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}

/* ---- 合言葉ゲート ---- */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
#gate .box{width:100%;max-width:380px;text-align:center}
#gate h1{font-size:19px;margin:0 0 6px;letter-spacing:.02em}
#gate p{color:var(--sub);font-size:13px;margin:0 0 22px}
#gate .row{display:flex;gap:8px}
#gate input{flex:1;min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#gate input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
#gate button{padding:13px 20px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
#gate .err{color:#d9534f;font-size:13px;height:18px;margin-top:10px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:22px}

/* ---- ヘッダー ---- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top .mark{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.01em;line-height:1.25}
.top .hd{min-width:0}
.top .org{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.08em;line-height:1.2}
.top .cnt{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
.search{position:relative;padding-bottom:10px}
.search input{width:100%;padding:12px 40px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.search input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.search .ico{position:absolute;left:13px;top:11px;color:var(--sub);font-size:16px;pointer-events:none}
.search .clr{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:none;color:var(--sub);cursor:pointer;border-radius:50%;display:none}
.search .clr.on{display:block}
.tabs{display:flex;gap:6px;padding-bottom:8px}
.tabs button{padding:6px 13px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:6px 13px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;cursor:pointer;color:var(--sub)}
.chips button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.chips .n{opacity:.6;font-size:11px;margin-left:4px}

/* ---- 一覧 ---- */
main{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease;text-align:left;padding:0;width:100%}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,32,48,.08),0 10px 26px rgba(16,32,48,.12)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/9;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.fav{position:absolute;left:4px;top:4px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center;opacity:.45;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.card:hover .fav{opacity:.85}
.fav.on{color:#ffc93c;opacity:1}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ttl{font-size:13.5px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;color:var(--acc);background:var(--acc-soft);padding:2px 8px;border-radius:6px}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.date{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty b{display:block;font-size:16px;color:var(--fg);margin-bottom:6px}
.secttl{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:8px 0 -4px}

/* ---- 再生モーダル ---- */
#modal{position:fixed;inset:0;background:rgba(8,14,20,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.sheet{background:var(--card);border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.player{aspect-ratio:16/9;background:#000;border-radius:16px 16px 0 0;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.info{padding:16px 18px 20px}
.info h2{font-size:16px;margin:0 0 8px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.info pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;color:var(--sub);margin:0;background:var(--bg);padding:12px 14px;border-radius:10px;max-height:230px;overflow:auto}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button,.acts a{padding:9px 15px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--fg)}
.acts .prim{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
#modal .x{position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
footer{max-width:1180px;margin:0 auto;padding:24px 16px 40px;color:var(--sub);font-size:12px;text-align:center;border-top:1px solid var(--line)}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#5c4a12;color:#ffe9a8}}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .ttl{font-size:12.5px}
  main{padding:12px 12px 70px}
  .wrap{padding:0 12px}
  .top h1{font-size:14px}
  .top .org{font-size:9.5px}
}
</style>
</head>

   お気に入り・最近見たは混ざると邪魔なのでこのサイト専用のキーにする。 */
const LS = {pw:"vm_pw", fav:"sv_fav", hist:"sv_hist"};
const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2a(ENC.salt), iterations:200000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(ENC.iv)}, key, b2a(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---- 検索用の正規化：カタカナ→ひらがな、全角→半角、小文字化 ---- */
function norm(s){
  return (s||"").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[ 　\-–—・.,、。（）()【】\[\]「」]/g, "");
}

let DATA=null, V=[], tab="all", cat="", q="";
const fav = new Set(JSON.parse(localStorage.getItem(LS.fav)||"[]"));
let hist = JSON.parse(localStorage.getItem(LS.hist)||"[]");
const save = () => {localStorage.setItem(LS.fav, JSON.stringify([...fav])); localStorage.setItem(LS.hist, JSON.stringify(hist));};
const $ = s => document.querySelector(s);

function boot(d){
  DATA = d; V = d.videos.map(v => ({...v, _n: norm(v.t+" "+v.d+" "+v.c)}));
  $("#gate").remove(); $("#app").hidden = false;
  $("#upd").textContent = "最終更新 " + ENC.built + "　／　収録 " + V.length + "本";
  const counts = {}; V.forEach(v => counts[v.c] = (counts[v.c]||0)+1);
  $("#chips").innerHTML = '<button data-c="" aria-pressed="true">すべて<span class="n">'+V.length+'</span></button>'
    + d.cats.map(c => `<button data-c="${c}" aria-pressed="false">${c}<span class="n">${counts[c]||0}</span></button>`).join("");
  $("#chips").onclick = e => {const b = e.target.closest("button"); if(!b) return;
    cat = b.dataset.c; [...$("#chips").children].forEach(x => x.setAttribute("aria-pressed", x===b));
    b.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"}); render();};
  $("#tabs").onclick = e => {const b = e.target.closest("button"); if(!b) return;
    tab = b.dataset.tab; [...$("#tabs").children].forEach(x => x.setAttribute("aria-selected", x===b)); render();};
  $("#q").oninput = e => {q = norm(e.target.value); $("#clr").classList.toggle("on", !!e.target.value); render();};
  $("#clr").onclick = () => {$("#q").value=""; q=""; $("#clr").classList.remove("on"); render(); $("#q").focus();};
  render();
}

function filtered(){
  let list = V;
  if(tab==="fav") list = list.filter(v => fav.has(v.i));
  if(tab==="hist"){const o = {}; hist.forEach((id,ix) => o[id]=ix); list = V.filter(v => v.i in o).sort((a,b) => o[a.i]-o[b.i]);}
  if(cat) list = list.filter(v => v.c===cat);
  if(q){const ws = q.split(/\s+/).filter(Boolean); list = list.filter(v => ws.every(w => v._n.includes(w)));}
  return list;
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(t){ if(!q) return esc(t);
  const ws = q.split(/\s+/).filter(Boolean); let out = esc(t);
  // 正規化前後で位置がずれるため、素の文字列に含まれる語だけ強調する
  ws.forEach(w => {const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"); out = out.replace(re, m => "<mark>"+m+"</mark>");});
  return out;
}

function render(){
  const list = filtered(), g = $("#grid");
  $("#cnt").textContent = list.length + " / " + V.length + "本";
  if(!list.length){
    g.innerHTML = '<div class="empty"><b>見つかりませんでした</b>'
      + (tab==="fav" ? "動画の左上の★を押すと、ここに集まります。"
        : tab==="hist" ? "一度見た動画がここに並びます。"
        : "別の言葉で探してみてください。（例：根管／インビザ／歯周／経営）") + '</div>';
    return;
  }
  let html = "", last = null;
  const grouped = (!cat && !q && tab==="all");
  list.forEach(v => {
    if(grouped && v.c!==last){ html += `<div class="secttl">${v.c}</div>`; last = v.c; }
    html += `<button class="card" data-id="${v.i}">
      <div class="thumb">
        <img loading="lazy" src="https://i.ytimg.com/vi/${v.i}/mqdefault.jpg" alt="">
        <span class="dur">${v.l}</span>
        <span class="fav${fav.has(v.i)?" on":""}" data-fav="${v.i}" role="button" aria-label="お気に入り">★</span>
      </div>
      <div class="body"><div class="ttl">${hl(v.t)}</div><div class="foot"><span class="tag">${v.c}</span><span class="date">${v.y.slice(0,7).replace("-","/")}</span></div></div>
    </button>`;
  });
  g.innerHTML = html;
}

$("#grid").onclick = e => {
  const f = e.target.closest("[data-fav]");
  if(f){ e.stopPropagation(); const id = f.dataset.fav;
    fav.has(id) ? fav.delete(id) : fav.add(id); save(); render(); return; }
  const c = e.target.closest(".card"); if(c) open(c.dataset.id);
};

function open(id){
  const v = V.find(x => x.i===id); if(!v) return;
  hist = [id, ...hist.filter(x => x!==id)].slice(0,40); save();
  $("#player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&autoplay=1&modestbranding=1" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
  $("#mt").textContent = v.t;
  $("#mm").innerHTML = `<span class="tag">${v.c}</span><span>${v.l}</span><span>${v.y}</span>`;
  $("#md").textContent = v.d || "（説明はありません）";
  $("#md").style.display = v.d ? "" : "none";
  $("#myt").href = "https://www.youtube.com/watch?v=" + id;
  const fb = $("#mfav");
  const sync = () => fb.textContent = fav.has(id) ? "★ お気に入り済み" : "☆ お気に入りに追加";
  fb.onclick = () => {fav.has(id) ? fav.delete(id) : fav.add(id); save(); sync(); render();};
  sync();
  $("#mcopy").onclick = async () => {
    try{ await navigator.clipboard.writeText("https://www.youtube.com/watch?v="+id);
         $("#mcopy").textContent = "コピーしました"; setTimeout(()=>$("#mcopy").textContent="リンクをコピー",1600);
    }catch(_){ $("#mcopy").textContent = "コピーできません"; }
  };
  $("#modal").classList.add("on"); document.body.style.overflow = "hidden";
}
function close(){ $("#modal").classList.remove("on"); $("#player").innerHTML=""; document.body.style.overflow=""; render(); }
$("#x").onclick = close;
$("#modal").onclick = e => {if(e.target.id==="modal") close();};
document.addEventListener("keydown", e => {if(e.key==="Escape" && $("#modal").classList.contains("on")) close();});

/* ---- ゲート ---- */
async function tryPw(pw, remember){
  try{
    const d = await unlock(pw);
    if(remember) localStorage.setItem(LS.pw, pw);
    boot(d); return true;
  }catch(_){ return false; }
}
(async () => {
  const saved = localStorage.getItem(LS.pw);
  if(saved && await tryPw(saved, false)) return;
  // 保存済みの合言葉が通らない＝院長が合言葉を入れ替えた直後。何が起きたか画面で伝える
  if(saved){
    localStorage.removeItem(LS.pw);
    $("#err").textContent = "合言葉が新しくなりました";
    $("#gate").querySelector("p").innerHTML +=
      "<br><b>合言葉が変更されました。</b>院長から共有された新しい合言葉を入れてください";
  }
  const go = async () => {
    const pw = $("#pw").value.trim();
    if(!pw) return;
    $("#err").textContent = "確認中…";
    if(!await tryPw(pw, true)){ $("#err").textContent = "合言葉が違います"; $("#pw").select(); }
  };
  $("#go").onclick = go;
  $("#pw").onkeydown = e => {if(e.key==="Enter") go();};
  $("#pw").focus();
})();
</script>
</body>
</html>
